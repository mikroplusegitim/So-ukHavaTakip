[build]
  base = "frontend/"
  publish = "build"
  command = "yarn install --frozen-lockfile && yarn build"

[build.environment]
  # Netlify üzerinde ayarlanacak değerler için yer tutucu.
  # Asıl değer Netlify UI > Site settings > Environment variables bölümünden tanımlanır.
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"
  CI = "false"          # CRA uyarılarını hata sayma

# SPA için: tüm rotaları index.html'e yönlendir
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
